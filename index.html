<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undangan Pernikahan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="no-scroll">
    <!-- BACKGROUND UTAMA (cover.png) -->
    <img src="cover.png" alt="Background" class="fixed-background" />

    <!-- LAYER 1: COVER INTERAKTIF -->
    <div id="layer1" class="layer-cover">
      <div class="cover-content">
        <button id="btn-open" class="btn-open">Buka Undangan</button>
      </div>
    </div>

    <!-- WRAPPER UNTUK LAYER 2 - 5 -->
    <main id="main-content" class="main-container hidden">
      <!-- LAYER 2: VIDEO -->
      <section class="layer-section">
        <div class="media-wrapper">
          <video id="my-video" class="media-content" playsinline preload="auto">
            <source src="video.mp4" type="video/mp4" />
            Browser Anda tidak mendukung tag video.
          </video>
        </div>
      </section>

      <!-- LAYER 3 -->
      <section class="layer-section">
        <div class="media-wrapper">
          <img src="layer3.png" alt="Layer 3" class="media-content" />
        </div>
      </section>

      <!-- LAYER 4 -->
      <section class="layer-section">
        <div class="media-wrapper">
          <img src="layer4.png" alt="Layer 4" class="media-content" />
        </div>
      </section>

      <!-- LAYER 5 -->
      <section class="layer-section">
        <div class="media-wrapper">
          <img src="layer5.png" alt="Layer 5" class="media-content" />

          <!-- TOMBOL INTERAKTIF (GOOGLE MAPS & WHATSAPP) -->
          <div class="action-buttons">
            <!-- Tombol Google Maps (Ganti URL dengan link Google Maps lokasi acara) -->
            <a
              href="https://maps.google.com/?q=Lokasi+Acara"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-action btn-maps"
            >
              <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                />
              </svg>
              <span>Buka Google Maps</span>
            </a>

            <!-- Tombol WhatsApp RSVP (Ganti 628123456789 dengan nomor WA pengantin) -->
            <a
              href="https://wa.me/628123456789?text=Halo,%20saya%20ingin%20mengonfirmasi%20kehadiran%20di%20acara%20pernikahan%20Windi%20%26%20Fikri."
              target="_blank"
              rel="noopener noreferrer"
              class="btn-action btn-wa"
            >
              <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"
                />
              </svg>
              <span>RSVP via WhatsApp</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
